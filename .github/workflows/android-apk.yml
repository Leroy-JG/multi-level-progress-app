# Construit un APK Android installable directement (sans Google Play, sans compte Expo).
# Lancer à la main (Actions → « APK Android » → Run workflow) ou en poussant un tag « v* » (ex. v2.0.0) :
# l'APK est alors joint à la release GitHub correspondante.
# Signature : clé personnelle si les secrets ANDROID_* existent (voir « Signature avec la clé personnelle »),
# sinon clé de debug publique du modèle Expo (suffisant pour s'installer soi-même, à ne pas diffuser).
name: APK Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Droits minimaux : lecture seule pour construire ; l'écriture (release) n'est donnée qu'au job qui publie.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Générer le projet Android natif
        run: npx expo prebuild --platform android --no-install
      # Signature : si les 4 secrets existent (Réglages → Secrets and variables → Actions), l'APK est signé avec VOTRE clé.
      # Sinon (ou si certains manquent) : clé de debug publique du modèle Expo, avec un avertissement.
      - name: Signature avec la clé personnelle
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          present=0
          for v in "$KEYSTORE_B64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            [ -n "$v" ] && present=$((present + 1))
          done
          if [ "$present" -eq 0 ]; then
            echo "::warning::Aucun secret de signature : APK signé avec la clé de debug PUBLIQUE (à ne pas diffuser)."
            exit 0
          fi
          if [ "$present" -ne 4 ]; then
            echo "::error::Secrets de signature incomplets ($present/4)."
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          python3 scripts/sign-release.py
      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Alam.apk
      - name: Empreinte de la signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs Alam.apk | grep -E "certificate (DN|SHA-256)"
      - uses: actions/upload-artifact@v4
        with:
          name: Alam-apk
          path: Alam.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Alam-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: Alam.apk
